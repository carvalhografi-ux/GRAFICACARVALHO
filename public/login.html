<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#393c99"><title>Login · Gráfica Carvalho</title><style>
:root{--purple:#393c99;--ink:#26305e;--muted:#74809b;--line:#e0e5f1;--bg:#f5f6fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}a{color:#484ba5}button{cursor:pointer}.btn{background:#484da9;color:#fff;border:0;border-radius:11px;padding:12px 17px;font-weight:800}.btn:hover{filter:brightness(1.06)}.secondary{background:#eef0fa;color:#363a88}.surface{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 13px 37px #242f6210;padding:28px}.header{background:#383c94;color:white;padding:15px clamp(17px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.header img{width:215px;max-width:55vw}.header a,.header button{background:#ffffff18;color:#fff;border:1px solid #ffffff3b;padding:10px 13px;border-radius:10px;text-decoration:none;font-weight:650}.container{max-width:1110px;margin:32px auto;padding:0 20px}.muted{color:var(--muted);font-size:13px}.field{margin-bottom:14px}label{display:block;font-weight:750;font-size:12px;color:#5f6992;margin-bottom:7px}input,select{border:1px solid #d8dfef;border-radius:10px;padding:12px;width:100%;background:white;color:#293261;min-height:43px}input:focus,select:focus{outline:2px solid #a7b4ff}h1{letter-spacing:-.6px}h2{font-size:19px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f6f7fc;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7984a6}td,th{padding:13px 11px;border-bottom:1px solid #e9ecf4}td{vertical-align:middle}.scroll{overflow-x:auto}.pill{border-radius:999px;padding:5px 10px;background:#eef0ff;color:#494cab;display:inline-block;font-weight:750;font-size:11px}.pill.done{background:#e6f8f1;color:#218364}.pill.wait{background:#fff1df;color:#a0690d}.message{margin:13px 0;min-height:20px;color:#bd3752;font-size:13px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:210px}.ghost{background:transparent;border:1px solid #dce3f0;padding:8px 11px;border-radius:9px;color:#3d4489;font-weight:700}.mini{font-size:11px;color:#8892a8}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}@media(max-width:650px){.surface{padding:18px}.container{margin:15px auto}.header img{width:180px}table{min-width:580px}}
</style><script src="/config.js"></script><script src="/bridge.js"></script><script id="wix-site-script" src="https://manage.wix.com/_api/headless-business-setup/v1/headless-business/site-script.js" data-client-id="31912594-65db-4a2f-b161-ccb2c020b4d7" async></script></head><body><div class="header"><img src="/static/logo_carvalho.png" alt="Gráfica Carvalho"><span>Acesso seguro ao sistema</span></div><main class="container" style="max-width:460px;margin-top:7vh"><section class="surface"><div style="font-size:30px">🔐</div><h1>Entrar no sistema</h1><p class="muted">Funcionários e clientes utilizam suas próprias contas. O acesso é liberado pelo administrador.</p><form id="login"><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username" maxlength="160" placeholder="seuemail@exemplo.com"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></div><button id="submit" type="submit" class="btn" style="width:100%">Entrar</button><div id="message" class="message" role="alert"></div></form></section><p class="muted" style="text-align:center">Gráfica Carvalho · Comunicação Visual</p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;m.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Não foi possível entrar');location.replace(d.redirect==='/portal'?'/portal.html':'/index.html')}catch(err){m.textContent=err.message;b.disabled=false}};</script></body></html>
