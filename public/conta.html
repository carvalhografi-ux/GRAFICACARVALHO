<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha · Gráfica Carvalho</title><style>body{font:14px Arial,sans-serif;background:#f4f5fb;color:#293262;margin:0}header{background:#393c99;padding:20px;text-align:center}header img{width:280px;max-width:80vw}.box{margin:55px auto;max-width:420px;background:white;border:1px solid #e2e5f2;border-radius:16px;padding:28px;box-shadow:0 16px 50px #292f601a}label{display:block;margin:18px 0 6px;font-weight:bold}input{width:100%;box-sizing:border-box;border:1px solid #dae0ed;border-radius:8px;padding:12px;font:inherit}button{background:#4a4da8;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer;margin-top:19px}a{color:#4a4da8}#msg{color:#b54c62}</style><script src="/config.js"></script><script src="/bridge.js"></script><script id="wix-site-script" src="https://manage.wix.com/_api/headless-business-setup/v1/headless-business/site-script.js" data-client-id="31912594-65db-4a2f-b161-ccb2c020b4d7" async></script></head><body><header><img src="/static/logo_carvalho.png" alt="Gráfica Carvalho"></header><main class="box"><h1>Alterar minha senha</h1><p>Escolha uma senha exclusiva de pelo menos 12 caracteres. Após a troca, será necessário entrar novamente.</p><form id="f"><label>Senha atual</label><input name="current" type="password" required autocomplete="current-password"><label>Nova senha</label><input name="new" type="password" minlength="12" required autocomplete="new-password"><button>Salvar nova senha</button><p id="msg" role="alert"></p></form><p><a id="back" href="/">← Voltar ao sistema</a></p></main><script>let csrf='';fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(!x.authenticated){location.replace('/login.html');return}csrf=x.csrf;document.getElementById('back').href=x.user.role==='client'?'/portal.html':'/index.html'});document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/auth/password',{method:'POST',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/json'},body:JSON.stringify(d)});let x=await r.json();if(r.ok)location.replace('/login.html');else document.getElementById('msg').textContent=x.detail||'Falha ao alterar senha'};</script></body></html>
