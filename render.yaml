# Gráfica Carvalho — Render Free + Neon Free
# Nenhum banco PostgreSQL Render ou Persistent Disk será criado.
services:
  - type: web
    name: grafica-carvalho-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GRAFICA_WIX_ORIGIN
        value: https://headless-fynqkyfsoyi-carvalhografi-140d.wix-site-host.com
      - key: GRAFICA_SECURE_COOKIES
        value: '1'
      - key: GRAFICA_ADMIN_EMAIL
        sync: false
      - key: GRAFICA_ADMIN_PASSWORD
        sync: false
