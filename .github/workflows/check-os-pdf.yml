name: Validar PDF com fotos e modos de cor
on:
  pull_request:
    branches: [render-free-neon-postgres]
  push:
    branches: [os-fotos-cor-backend-20261013]
permissions:
  contents: read
jobs:
  pdf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pypdf>=5,<7'
      - run: python -m compileall -q app.py print_queue.py database.py security.py
      - run: python -m unittest discover -s tests -p 'test_pdf_photos.py' -v
