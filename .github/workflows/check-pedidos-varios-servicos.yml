name: Verificar cadastro com vários serviços
on:
  pull_request:
    branches: [url-curta-interface-render]
  push:
    branches: [pedido-varios-servicos-site-20261014]
permissions:
  contents: read
jobs:
  multi-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pedidos_varios_servicos.test.cjs
